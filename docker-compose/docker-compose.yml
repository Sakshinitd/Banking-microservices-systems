version: '3.9'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: banking

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - banking-system

  redis:
    image: redis:7.2
    container_name: redis

    ports:
      - "8089:6379"

    networks:
      - banking-system

  kafka:
    image: apache/kafka:latest
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    networks:
      - banking-system

  eureka-server:
    image: eureka-server:1.0
    container_name: eureka-server

    ports:
      - "8761:8761"

    environment:
      SERVER_PORT: 8761

    networks:
      - banking-system

  api-gateway:
    image: api-gateway:1.0
    container_name: api-gateway

    ports:
      - "8000:8000"

    depends_on:
      - redis
      - eureka-server

    environment:
      SERVER_PORT: 8000

      REDIS_HOST: redis
      REDIS_PORT: 6379

      EUREKA_URL: http://eureka-server:8761/eureka

    networks:
      - banking-system

  auth-service:
    image: auth-service:1.0
    container_name: auth-service

    ports:
      - "8081:8081"

    depends_on:
      - mysql
      - redis
      - eureka-server

    environment:
      SERVER_PORT: 8081

      DB_URL: jdbc:mysql://mysql:3306/banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root

      REDIS_HOST: redis
      REDIS_PORT: 6379

      EUREKA_URL: http://eureka-server:8761/eureka

    networks:
      - banking-system

  account-service:
    image: account-service:1.0
    container_name: account-service

    ports:
      - "8082:8082"

    depends_on:
      - mysql
      - redis
      - eureka-server
      - kafka

    environment:
      SERVER_PORT: 8082

      DB_URL: jdbc:mysql://mysql:3306/banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root

      REDIS_HOST: redis
      REDIS_PORT: 6379

      EUREKA_URL: http://eureka-server:8761/eureka

      KAFKA_SERVERS: kafka:9092

    networks:
      - banking-system

  transaction-service:
    image: transaction-service:1.0
    container_name: transaction-service

    ports:
      - "8083:8083"

    depends_on:
      - mysql
      - redis
      - eureka-server
      - kafka

    environment:
      SERVER_PORT: 8083

      DB_URL: jdbc:mysql://mysql:3306/banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root

      REDIS_HOST: redis
      REDIS_PORT: 6379

      EUREKA_URL: http://eureka-server:8761/eureka

      KAFKA_SERVERS: kafka:9092

    networks:
      - banking-system

  notification-service:
    image: notification-service:1.0
    container_name: notification-service

    ports:
      - "8084:8084"

    depends_on:
      - mysql
      - redis
      - kafka
      - eureka-server

    environment:
      SERVER_PORT: 8084

      DB_URL: jdbc:mysql://mysql:3306/banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root

      REDIS_HOST: redis
      REDIS_PORT: 6379

      EUREKA_URL: http://eureka-server:8761/eureka

      KAFKA_SERVERS: kafka:9092

      EMAIL_ID: your-gmail@gmail.com
      EMAIL_PASSWORD: your-gmail-password@gmail.com
      EMAIL_PORT: 587

    networks:
      - banking-system

networks:
  banking-system:
    driver: bridge

volumes:
  mysql-data: